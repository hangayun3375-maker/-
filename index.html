<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>믿어방</title>
<meta name="theme-color" content="#F7D27C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="믿어방">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFCF3;--card:#fff;--ink:#2B2418;--sub:#8A7F6A;--y:#F7D27C;--y2:#FCEFC9;--line:#F0E6CC;--g:#5E9E6A;--m:#D99A2B;--b:#D4614F;--on:#2B2418;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140E;--card:#221E15;--ink:#F6EEDC;--sub:#A99F88;--line:#383121;--y2:#3A3118;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17140E;--card:#221E15;--ink:#F6EEDC;--sub:#A99F88;--line:#383121;--y2:#3A3118;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;-webkit-tap-highlight-color:transparent}
:root{--fh:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
#ph{position:relative;display:flex;flex-direction:column;height:var(--fh);max-width:480px;margin:0 auto;overflow:hidden}
#app{flex:1;overflow-y:auto;padding:20px 18px 24px}
.st{min-height:calc(var(--fh) - 150px);display:flex;flex-direction:column}
.mid{flex:1;display:grid;place-content:center;text-align:center;gap:8px;padding:40px 0}
.mid .logo{font-size:48px}
@media (min-width:481px){
:root{--fh:min(844px,calc(100vh - 40px))}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--line)}
#ph{width:390px;max-width:none;margin:0;flex:none;border:8px solid var(--ink);border-radius:44px;background:var(--bg);box-shadow:0 20px 60px rgba(0,0,0,.18)}
#app::-webkit-scrollbar{display:none}
nav{border-radius:0 0 36px 36px}

}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{font-size:24px;font-weight:900;letter-spacing:-.04em}
.logo i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--y);margin-left:4px}
.tag{font-size:12px;color:var(--sub)}
h2{font-size:20px;font-weight:700;letter-spacing:-.03em;margin-bottom:4px}
p.s{font-size:13px;color:var(--sub);line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{width:100%;border:0;border-radius:14px;background:var(--y);color:var(--on);font:700 16px inherit;font-family:inherit;padding:15px;cursor:pointer}
.btn:disabled{opacity:.5}.btn.ghost{background:var(--y2);color:var(--ink)}
.btn.sm{width:auto;font-size:13px;padding:8px 12px;border-radius:10px;flex:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.chip{font-size:12px;font-weight:500;padding:4px 10px;border-radius:99px;background:var(--y2);display:inline-block}
.chip.on{background:var(--y)}
input[type=number],input[type=text],input[type=email],textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;padding:12px;margin-top:6px}
textarea{resize:none;height:90px}
label.l{font-size:13px;font-weight:500;display:block;margin-top:12px}
.bar{height:6px;border-radius:9px;background:var(--y2);overflow:hidden;margin-top:12px}
.bar b{display:block;height:100%;width:0;background:var(--y);transition:width .3s}
.hero{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring strong{font-size:30px;font-weight:900;line-height:1}.ring span{font-size:11px;color:var(--sub)}
.grid{display:grid;gap:10px;margin-top:12px}
.m{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.ic{width:42px;height:42px;border-radius:12px;background:var(--y2);display:grid;place-content:center;font-size:20px;flex:none}
.m .t{font-size:13px;color:var(--sub)}.m .v{font-size:19px;font-weight:700;letter-spacing:-.02em}
.m .d{font-size:12px;color:var(--sub);margin-top:1px}
.lv{margin-left:auto;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;color:#fff;white-space:nowrap}
.l0{background:var(--g)}.l1{background:var(--m)}.l2{background:var(--b)}
.map{background:var(--y2);border:1px solid var(--line);border-radius:16px;margin-top:12px;overflow:hidden}
.map svg{display:block;width:100%}
.blur{filter:blur(6px);user-select:none;pointer-events:none}
.lock{margin-top:12px;text-align:center}
.badge{font-size:11px;font-weight:700;background:var(--y);color:var(--on);padding:2px 8px;border-radius:99px;margin-left:6px}
.sc{font-size:22px;font-weight:900;min-width:44px;text-align:right}
nav{flex:none;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center}
nav div{display:flex;width:100%;max-width:480px}
nav button{flex:1;border:0;background:none;color:var(--sub);font:500 12px inherit;font-family:inherit;padding:10px 0 12px;cursor:pointer}
nav button span{display:block;font-size:20px;margin-bottom:2px}
nav button.on{color:var(--ink);font-weight:700}
nav button.on span{background:var(--y);border-radius:99px;width:48px;margin:0 auto 2px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:14px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;z-index:9;max-width:90%;text-align:center}
.seg{display:flex;background:var(--y2);border-radius:12px;padding:4px;margin-top:14px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font:500 14px inherit;font-family:inherit;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--y);font-weight:700}
.lk{background:none;border:0;color:var(--sub);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline}
.cover{background:var(--y);color:var(--on);border-radius:24px;padding:48px 24px 40px;margin-top:8vh}
.cover .logo{font-size:44px}.cover .logo i{background:var(--on);width:14px;height:14px}
.cover p{margin-top:10px;font-size:15px;line-height:1.5}
.pick{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;font-family:inherit;color:var(--ink);cursor:pointer}
.pick b{font-size:17px;display:block}.pick span{font-size:13px;color:var(--sub)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cols div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.cols b{display:block;font-size:20px}.cols span{font-size:11px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
</style>
</head>
<body>
<div id="ph"><div id="app"></div>
<nav id="nv" style="display:none"><div id="nav"></div></nav></div>
<script>
var rl=null,scr='start',lt=0,tab='measure',nick='',lb=0,M=null,conn=false,meas=false,prog=0,draw=3.5,unl=false;
var IS=['습도·곰팡이','가스·냄새','환기·공기질','소음','방 크기 오차'];
var B=[
{n:'청운빌라',x:70,y:60,R:[{s:78,iss:[3],res:[],c:'벽간 소음이 조금 있어요. 환기는 잘 돼요.',k:'익명 거주자 #2041'},{s:72,iss:[0,3],res:[],c:'겨울에 결로가 생기고 옆집 소리가 들려요.',k:'익명 거주자 #5517'},{s:85,iss:[],res:[],c:'전체적으로 쾌적해요.',k:'익명 거주자 #3390'}]},
{n:'한빛하우스',x:200,y:40,R:[{s:50,iss:[0,2],res:[],c:'습도가 늘 70%를 넘고 옷장에 곰팡이가 폈어요.',k:'익명 거주자 #7782'},{s:58,iss:[0],res:[],c:'환기를 자주 해도 습해요.',k:'익명 거주자 #1126'}]},
{n:'대학로 스카이원룸',x:150,y:120,R:[{s:71,iss:[4],res:[],c:'방이 도면보다 작아요.',k:'익명 거주자 #6403'},{s:69,iss:[3],res:[],c:'위층 소음이 커요.',k:'익명 거주자 #8815'},{s:75,iss:[],res:[],c:'살기엔 무난해요.',k:'익명 거주자 #4208'}]},
{n:'푸른빌',x:270,y:100,R:[{s:63,iss:[2],res:[],c:'CO2가 금방 올라가요.',k:'익명 거주자 #9051'}]},
{n:'새봄원룸',x:40,y:130,R:[{s:90,iss:[],res:[],c:'쾌적하고 도면과 실측이 거의 같아요.',k:'익명 거주자 #1873'},{s:88,iss:[4],res:[],c:'만족해요. 방 길이만 조금 달라요.',k:'익명 거주자 #2764'}]}];
function $(s){return document.querySelector(s)}
function gt(){scrollTo(0,0);$('#app').scrollTop=0}
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;$('#ph').appendChild(d);setTimeout(function(){d.remove()},2400)}
function lvOf(v,a,b){return v<a?0:v<b?1:2}
function col(s){return s>=75?'var(--g)':s>=55?'var(--m)':'var(--b)'}
function calc(b){
 var n=b.R.length,res=0,un=0;b.R.forEach(function(r){res+=r.res.length;un+=r.iss.length-r.res.length});
 var o={n:n,ok:n>=2,res:res,un:un};
 if(o.ok){var s=b.R.map(function(r){return r.s}).sort(function(a,c){return a-c});if(n>=5)s=s.slice(1,-1);
  o.avg=Math.round(s.reduce(function(a,c){return a+c},0)/s.length);o.fin=Math.min(100,o.avg+res*3)}
 return o}
function analyze(){
 var t=+(20+Math.random()*8).toFixed(1),h=Math.round(42+Math.random()*38);
 var g=Math.log(h/100)+17.62*t/(243.12+t),dew=+(243.12*g/(17.62-g)).toFixed(1);
 var voc=Math.round(60+Math.random()*180),co2=Math.round(480+Math.random()*1150),db=Math.round(30+Math.random()*22);
 var err=Math.round(Math.random()*30-8),ms=+(draw+err/100).toFixed(2);
 var lh=(h>70||t-dew<3)?2:(h>60||h<30)?1:0;
 var o={t:t,h:h,dew:dew,voc:voc,co2:co2,db:db,err:err,meas:ms,L:[lh,lvOf(voc,100,200),lvOf(co2,800,1200),lvOf(db,38,46),lvOf(Math.abs(err),5,15)]};
 o.score=Math.round(o.L.reduce(function(a,l){return a+[100,65,30][l]},0)/5);return o}
function startMeasure(){
 if(!conn){toast('먼저 키트를 연결해 주세요');return}
 meas=true;prog=0;render();
 var iv=setInterval(function(){prog+=4;var b=$('.bar b');if(b)b.style.width=prog+'%';
  if(prog>=100){clearInterval(iv);meas=false;M=analyze();render();toast('측정이 끝났어요')}},120)}
function cards(){
 var L=M.L,lab=[['건조','적정','곰팡이 위험'],['낮음','보통','높음'],['쾌적','환기 필요','환기 불량'],['조용','보통','시끄러움'],['일치','오차 있음','가벽 의심']];
 var rows=[['🌡️','온·습도',M.t+'°C · '+M.h+'%','이슬점 '+M.dew+'°C'],['💨','가스·냄새','VOC '+M.voc,'가스 종류는 구분하지 않고 상대 수준만 표시'],['🫧','공기질','CO₂ '+M.co2+' ppm','환기 상태 지표'],['🔊','소음',M.db+' dB','상대 비교용 · 녹음은 저장하지 않아요'],['📏','레이저 거리',M.meas+' m','도면 '+draw+' m 대비 '+(M.err>0?'+':'')+M.err+' cm']];
 return rows.map(function(r,i){var l=L[i],tx=i==0?['적정','주의 필요','곰팡이 위험'][l]:lab[i][l];
  return '<div class="m"><div class="ic">'+r[0]+'</div><div><div class="t">'+r[1]+'</div><div class="v">'+r[2]+'</div><div class="d">'+r[3]+'</div></div><span class="lv l'+l+'">'+tx+'</span></div>'}).join('')}
function ring(sc){var c=2*Math.PI*44;
 return '<div class="ring"><svg width="104" height="104"><circle cx="52" cy="52" r="44" fill="none" stroke="var(--y2)" stroke-width="10"/><circle cx="52" cy="52" r="44" fill="none" stroke="'+col(sc)+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+(c*sc/100)+' '+c+'"/></svg><div><strong>'+sc+'</strong><span>안심 지수</span></div></div>'}

/* 시작·로그인 */
function pStart(){
 return '<div class="st"><div class="mid"><div class="logo">믿어방</div><p class="s">대학생 주거환경 팩트체크</p></div><div>'+
 '<button class="pick" onclick="rl=\'student\';scr=\'login\';lt=0;render()"><b>대학생으로 시작</b><span>학교 이메일 또는 학생증으로 인증하고, 익명으로 후기를 남겨요</span></button>'+
 '<button class="pick" onclick="rl=\'landlord\';scr=\'login\';lt=0;render()"><b>집주인·부동산으로 시작</b><span>후기를 확인하고 개선한 항목은 점수를 회복해요</span></button></div></div>'}
function pLogin(){
 var st=rl=='student',h='<button class="lk" onclick="scr=\'start\';render()">← 처음으로</button><h2 style="margin-top:14px">'+(st?'대학생 로그인':'집주인·부동산 로그인')+'</h2>';
 h+='<div class="seg">'+(st?['학교 이메일','학생증']:['집주인','부동산']).map(function(t,i){return '<button class="'+(lt==i?'on':'')+'" onclick="lt='+i+';render()">'+t+'</button>'}).join('')+'</div><div class="card" style="margin-top:14px">';
 if(st&&lt==0)h+='<label class="l" for="a1" style="margin-top:0">학교 이메일</label><input id="a1" type="email" placeholder="이름@학교.ac.kr">';
 if(st&&lt==1)h+='<label class="l" for="a1" style="margin-top:0">학번</label><input id="a1" type="text" inputmode="numeric" placeholder="8~10자리 숫자"><label class="l" for="a2">이름</label><input id="a2" type="text" placeholder="인증에만 사용하고 저장하지 않아요">';
 if(!st){h+='<label class="l" for="a1" style="margin-top:0">'+(lt?'상호명':'이름')+'</label><input id="a1" type="text"><label class="l" for="a2">'+(lt?'사업자등록번호':'연락처')+'</label><input id="a2" type="text" inputmode="numeric">';
  h+='<label class="l" for="a3">관리하는 건물</label><select id="a3">'+B.map(function(b,i){return '<option value="'+i+'">'+esc(b.n)+'</option>'}).join('')+'</select>'}
 h+='<button class="btn" style="margin-top:16px" onclick="doLogin()">'+(st?'인증하고 시작하기':'로그인')+'</button><p id="er" role="alert" style="font-size:13px;color:var(--b);margin-top:10px;min-height:1em"></p></div>';
 if(st)h+='<p class="s" style="margin-top:12px">후기에는 실명 대신 익명 닉네임만 표시돼요.</p>';
 return h}
function err(t){var e=$('#er');if(e)e.textContent=t;else toast(t)}
function doLogin(){
 var a=$('#a1').value.trim(),b=$('#a2')?$('#a2').value.trim():'';
 if(rl=='student'){
  if(lt==0&&!/^[^\s@]+@[^\s@]+\.ac\.kr$/i.test(a)){err('학교 이메일은 .ac.kr로 끝나야 해요. 예: 이름@학교.ac.kr');return}
  if(lt==1&&(!/^\d{8,10}$/.test(a)||!b)){err('학번은 8~10자리 숫자로, 이름과 함께 입력해 주세요');return}
  nick='익명 거주자 #'+(1000+Math.floor(Math.random()*9000));tab='measure'}
 else{if(!a||!b){err('모든 항목을 입력해 주세요');return}lb=+$('#a3').value;tab='dash'}
 scr='app';render();gt()}
function logout(){rl=null;scr='start';M=null;conn=false;unl=false;render()}

/* 학생 */
function pMeasure(){
 var h='<h2>우리 방 팩트체크</h2><p class="s">센서 키트로 1분 안에 방의 실제 환경을 확인해요.</p>';
 h+='<div class="card"><div class="row"><div><b>믿어방 키트</b><div class="tag">'+(conn?'MB-001 · 블루투스 연결됨':'연결된 키트 없음')+'</div></div><span class="chip'+(conn?' on':'')+'">'+(conn?'연결됨':'미연결')+'</span></div>';
 h+='<button class="btn ghost" style="margin-top:12px" onclick="conn=!conn;render()">'+(conn?'연결 해제':'키트 연결하기')+'</button>';
 h+='<label class="l" for="dw">도면상 방 길이 (m)</label><input id="dw" type="number" step="0.01" value="'+draw+'" oninput="draw=+this.value||0">';
 h+='<button class="btn" style="margin-top:14px" '+(meas?'disabled':'')+' onclick="startMeasure()">'+(meas?'측정 중…':'1분 측정 시작')+'</button>';
 if(meas)h+='<div class="bar"><b style="width:'+prog+'%"></b></div>';
 h+='</div>';
 if(M){h+='<div class="card hero">'+ring(M.score)+'<div><h2>'+(M.score>=75?'살기 좋은 방이에요':M.score>=55?'확인할 점이 있어요':'주의가 필요해요')+'</h2><p class="s">다섯 가지 항목을 종합한 지수예요.</p></div></div><div class="grid">'+cards()+'</div><button class="btn" style="margin-top:14px" onclick="tab=\'write\';render()">이 결과로 후기 남기기</button>'}
 else h+='<div class="card" style="text-align:center"><p class="s">아직 측정 결과가 없어요.<br>키트를 연결하고 측정을 시작해 보세요.</p></div>';
 return h}
function pin(x,y,s,ok){var c=ok?(s>=75?'#5E9E6A':s>=55?'#D99A2B':'#D4614F'):'#B8AD94';
 return '<g transform="translate('+x+','+y+')"><circle r="15" fill="'+c+'"/><text y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">'+(ok?s:'?')+'</text></g>'}
function pMap(){
 var h='<h2>안심 맵</h2><p class="s">건물 단위로 묶어 보여줘요. 후기가 2건 이상 모이면 평균 지수가 공개돼요. (예시 데이터)</p>';
 h+='<div class="map"><svg viewBox="0 0 320 180"><path d="M0 85H320M0 150H320M110 0V180M235 0V180" stroke="#fff" stroke-width="9" opacity=".7"/>';
 B.forEach(function(b){var c=calc(b);h+=pin(b.x,b.y,c.fin,c.ok)});h+='</svg></div>';
 if(!unl)h+='<div class="card lock"><b>후기를 등록하면 상세 후기를 볼 수 있어요</b><p class="s" style="margin:6px 0 12px">내 자취방 후기를 남기면 다른 건물의 후기도 열람할 수 있어요.</p><button class="btn" onclick="tab=\'write\';render()">후기 남기기</button></div>';
 h+='<div class="grid">'+B.map(function(b){var c=calc(b),t={};
  b.R.forEach(function(r){r.iss.forEach(function(i){if(r.res.indexOf(i)<0)t[i]=(t[i]||0)+1})});
  var ch=c.ok?Object.keys(t).map(function(i){return '<span class="chip">'+IS[i]+' '+t[i]+'</span>'}).join('')+(c.res?'<span class="chip on">개선 완료 '+c.res+'건</span>':''):'';
  var last=c.ok?'<div class="d '+(unl?'':'blur')+'" style="margin-top:8px;color:var(--ink)">'+esc(b.R[0].c)+'</div>':'';
  return '<div class="m" style="align-items:flex-start"><div style="flex:1;min-width:0"><b>'+esc(b.n)+'</b><div class="d">후기 '+c.n+'건'+(c.ok?'':' · 2건부터 결과가 공개돼요')+'</div><div class="chips">'+ch+'</div>'+last+'</div><div class="sc" style="color:'+(c.ok?col(c.fin):'var(--sub)')+'">'+(c.ok?c.fin:'–')+'</div></div>'}).join('')+'</div>';
 return h}
function pWrite(){
 var h='<h2>후기 남기기</h2><p class="s">건물 단위로만 기록하고, 호수·동 정보는 저장하지 않아요.</p><div class="card">';
 h+='<div class="row"><span class="tag">작성자</span><span class="chip on">'+nick+'</span></div>';
 h+='<label class="l" for="wb">건물</label><select id="wb">'+B.map(function(b,i){return '<option value="'+i+'">'+esc(b.n)+'</option>'}).join('')+'</select>';
 h+='<label class="l" for="wn">목록에 없다면 건물 이름 입력</label><input id="wn" type="text" placeholder="예: 햇살빌라">';
 h+='<label class="l" for="wc">솔직 후기</label><textarea id="wc" placeholder="소음, 곰팡이, 환기 등 살아보니 어땠나요?"></textarea>';
 h+='<div class="chk">'+(M?'📎 측정 결과 첨부됨 · 안심 지수 '+M.score:'📎 첨부할 측정 결과가 없어요')+'</div>';
 h+='<button class="btn" style="margin-top:16px" onclick="submitReview()">후기 등록하기</button></div>';
 h+='<p class="s" style="margin-top:12px">센서 측정이 포함된 후기만 평균에 반영돼요. 한두 건의 극단적인 후기가 결과를 좌우하지 않도록, 후기가 2건 이상 모여야 지수가 공개돼요.</p>';
 return h}
function submitReview(){
 var c=$('#wc').value.trim(),nn=$('#wn').value.trim();
 if(!M){toast('먼저 측정을 완료해 주세요');tab='measure';render();return}
 if(!c){toast('후기를 입력해 주세요');return}
 var b;if(nn){b=B.filter(function(x){return x.n==nn})[0];if(!b){b={n:nn,x:30+Math.random()*260,y:25+Math.random()*130,R:[]};B.push(b)}}else b=B[+$('#wb').value];
 b.R.unshift({s:M.score,iss:M.L.map(function(l,i){return l==2?i:-1}).filter(function(i){return i>=0}),res:[],c:c,k:nick});
 unl=true;toast('등록했어요. 이제 상세 후기를 볼 수 있어요');tab='map';render()}

/* 집주인·부동산 */
function pDash(){
 var b=B[lb],c=calc(b),h='<h2>'+esc(b.n)+'</h2><p class="s">우리 건물의 안심 지수와 회복 가능한 포인트예요.</p>';
 if(c.ok)h+='<div class="card hero">'+ring(c.fin)+'<div><b>후기 평균 '+c.avg+'점</b><p class="s" style="margin-top:4px">개선 완료 가산점 +'+(c.fin-c.avg)+'점이 반영돼 있어요.</p></div></div>';
 else h+='<div class="card" style="text-align:center"><b>후기 '+c.n+'/2건</b><p class="s" style="margin-top:6px">후기가 2건 이상 모이면 평균 지수가 공개돼요.<br>한 건의 후기만으로는 평가하지 않아요.</p></div>';
 h+='<div class="cols"><div><b>'+c.n+'</b><span>받은 후기</span></div><div><b>'+(c.un*3)+'</b><span>회복 가능 포인트</span></div><div><b>+'+(c.res*3)+'</b><span>회복한 포인트</span></div></div>';
 h+='<button class="btn" style="margin-top:14px" onclick="tab=\'cmp\';render()">불만 사항 확인하기</button>';
 return h}
function pCmp(){
 var b=B[lb],h='<h2>불만 사항</h2><p class="s">고친 항목은 개선 완료로 표시하면 항목당 3점이 회복돼요.</p><div class="grid">',n=0;
 b.R.forEach(function(r,ri){r.iss.forEach(function(i){n++;var d=r.res.indexOf(i)>=0;
  h+='<div class="m"><div style="flex:1;min-width:0"><div><b>'+IS[i]+'</b><span class="badge">'+(r.s>=0?'센서 측정':'')+'</span></div><div class="d">'+r.k+'</div><div class="d" style="color:var(--ink);margin-top:4px">'+esc(r.c)+'</div></div>'+
  (d?'<span class="chip on">개선 완료</span>':'<button class="btn sm" onclick="fix('+ri+','+i+')">개선 완료</button>')+'</div>'})});
 if(!n)h+='<div class="card" style="text-align:center"><p class="s">접수된 불만 사항이 없어요.</p></div>';
 return h+'</div>'}
function fix(ri,i){B[lb].R[ri].res.push(i);toast('개선 완료 처리됐어요 · +3점 회복');render()}

function render(){
 var st=rl=='student',p,nv=scr=='app';
 if(scr=='start')p=pStart();else if(scr=='login')p=pLogin();
 else p=st?(tab=='measure'?pMeasure():tab=='map'?pMap():pWrite()):(tab=='dash'?pDash():pCmp());
 var hd=nv?'<header><div class="logo">믿어방<i></i></div><div class="row"><span class="chip on">'+(st?'대학생':'집주인·부동산')+'</span><button class="lk" onclick="logout()">로그아웃</button></div></header>':(scr=='login'?'<header><div class="logo">믿어방<i></i></div></header>':'');
 $('#app').innerHTML=hd+p;$('#nv').style.display=nv?'flex':'none';
 var T=st?[['measure','📡','측정'],['map','🗺️','안심 맵'],['write','✍️','후기']]:[['dash','🏢','내 건물'],['cmp','🛠️','불만 사항']];
 $('#nav').innerHTML=nv?T.map(function(t){return '<button class="'+(tab==t[0]?'on':'')+'" onclick="tab=\''+t[0]+'\';render();gt()"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join(''):''}
render();
</script>
</body>
</html>
